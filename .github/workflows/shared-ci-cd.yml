name: Shared CI/CD Pipeline

# Reusable workflow template. TRUST ASSUMPTION: the command inputs below are
# executed verbatim in a shell, so this workflow must only be called from
# trusted repositories within this organization — never with input derived
# from untrusted sources (issue titles, PR bodies, forks, etc.).

on:
  workflow_call: # Enables reuse across repositories
    inputs:
      node-version:
        description: 'Node.js version'
        required: true
      build-command:
        description: 'Build command for the project'
        required: false
        default: 'npm run build'
      test-command:
        description: 'Test command for the project'
        required: false
        default: 'npm test'
      deploy-command:
        description: 'Deploy command for the project'
        required: false
        default: 'npm run deploy:staging'
    secrets:
      # Reserved for future deploy steps. Currently unused — no step reads it,
      # so callers should not pass it until a consuming step exists.
      API_KEY:
        required: false

# Least-privilege default for the GITHUB_TOKEN across all jobs.
permissions:
  contents: read

jobs:
  build-test-deploy:
    name: Build-Test-and-Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Build the project
        if: ${{ inputs.build-command }}
        run: ${{ inputs.build-command }}

      - name: Run tests
        run: ${{ inputs.test-command }}

      - name: Deploy the project
        if: ${{ inputs.deploy-command }}
        run: ${{ inputs.deploy-command }}
