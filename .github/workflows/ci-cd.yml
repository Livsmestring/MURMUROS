name: CI/CD Pipeline for MURMUROS

on:
  schedule:
    - cron: "0 2 * * *"
  push:
    branches: [main]
  pull_request:

# Least-privilege default — individual jobs grant only what they need.
# NEVER remove this block; set overrides at the job level instead.
permissions:
  contents: read

jobs:

  # ── 1. SECRET SCAN ──────────────────────────────────────────────────────
  # Runs first, in parallel with all other jobs. Blocks deploy on failure.
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # full history for thorough scan
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11  # v3.96.0
        with:
          extra_args: --only-verified

  # ── 2. PYTHON ───────────────────────────────────────────────────────────
  # Add new Python tools under core/, data/, or website/ — they are picked
  # up automatically by pytest (any test_*.py file) and linted via ruff once
  # ruff is added to requirements-dev.txt.
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.x"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Test
        run: pytest -v
      - name: Lint (ruff)
        run: |
          if pip show ruff >/dev/null 2>&1; then
            ruff check .
          else
            echo "ruff not in requirements-dev.txt yet — skipping Python lint"
          fi

  # ── 3. JAVASCRIPT ───────────────────────────────────────────────────────
  # Dormant until package.json is committed. All steps activate automatically
  # once it exists — no workflow changes needed.
  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 20  # LTS; bump to 22 when ecosystem support catches up
          cache: ${{ hashFiles('**/package-lock.json') != '' && 'npm' || '' }}
      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm ci
          else
            echo "No package.json yet — skipping"
          fi
      - name: Test
        run: |
          if [ -f package.json ]; then
            npm test
          else
            echo "No package.json yet — skipping"
          fi
      - name: Lint (ESLint)
        run: |
          if [ -f package.json ] && npm run 2>/dev/null | grep -q '^\s*lint'; then
            npm run lint
          else
            echo "No lint script yet — skipping ESLint"
          fi

  # ── 4. CODEQL ───────────────────────────────────────────────────────────
  # To add a new language: append it to the matrix list below. GitHub's
  # supported values: c-cpp, csharp, go, java-kotlin, javascript-typescript,
  # python, ruby, swift.
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # required to upload results to GitHub Security
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]  # ← add languages here
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Init CodeQL
        uses: github/codeql-action/init@a2983b8bed1923f44751c5c43237f479442827b3  # v3.37.4
        with:
          languages: ${{ matrix.language }}
      - name: Analyze
        uses: github/codeql-action/analyze@a2983b8bed1923f44751c5c43237f479442827b3  # v3.37.4

  # ── 5. DEPLOY ───────────────────────────────────────────────────────────
  # Runs only on main, only after all jobs above pass.
  # Add new deploy targets by adding steps below; the needs list is the gate.
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [secret-scan, python, javascript, codeql]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Deploy
        run: |
          if [ -f package.json ]; then
            npm run --if-present deploy:staging
          else
            echo "No deploy:staging script yet — skipping"
          fi
