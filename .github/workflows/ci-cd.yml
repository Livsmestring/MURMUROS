name: CI/CD Pipeline for MURMUROS

on:
  schedule:
    - cron: "0 2 * * *" # Runs at 2 AM daily
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up the environment (Install dependencies)
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16

      - name: Install dependencies
        run: npm install

      # Step 3: Run Tests
      - name: Run tests
        run: npm test

  python-test:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest -v

  static-analysis:
    name: Static Analysis and Code Quality
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 1: Run a linter (e.g., ESLint for JavaScript/Node.js projects)
      - name: Run ESLint for code quality checks
        run: npx eslint .

      # Step 2: Run additional static analysis, if needed
      - name: Static Code Analysis Placeholder
        run: echo "Add tools like SonarCloud, PyLint, or Flake8 based on your project"

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: python-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 1: Run GitHub CodeQL analysis for security scanning
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: 'python' # Update based on your repository

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2

  deploy:
    name: Deploy to Staging Environment
    runs-on: ubuntu-latest
    needs: [build-and-test, static-analysis, security-scan]
    if: github.ref == 'refs/heads/main' # Deploy only from the main branch

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy Application
        run: npm run deploy:staging # Replace with actual deploy command