name: CI/CD Pipeline for MURMUROS

on:
  schedule:
    - cron: "0 2 * * *" # Runs at 2 AM daily
  push:
    branches:
      - main
  pull_request:

# Least-privilege default for the GITHUB_TOKEN across all jobs.
permissions:
  contents: read

jobs:
  lint-yaml:
    name: Lint YAML
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: yamllint -d relaxed --strict .github/

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

  build-and-test:
    name: Build and Test (Node)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  static-analysis:
    name: Static Analysis and Code Quality
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint for code quality checks
        run: npm run lint

  # NOTE: CodeQL security scanning is handled by the repository's CodeQL
  # "default setup" (Settings → Code security), which already scans Python and
  # GitHub Actions. A workflow-defined ("advanced") CodeQL job cannot run while
  # default setup is enabled — it fails with a configuration error — so it is
  # intentionally not defined here. To move scanning into this workflow instead,
  # disable default setup in repo settings and add a CodeQL job back.

  deploy:
    name: Deploy to Staging Environment
    runs-on: ubuntu-latest
    needs: [lint-yaml, python-tests, build-and-test, static-analysis]
    if: github.ref == 'refs/heads/main' # Deploy only from the main branch

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Application
        run: |
          if [ -f package.json ] && npm run | grep -q 'deploy:staging'; then
            npm run deploy:staging
          else
            echo "No deploy:staging script yet — skipping deploy."
          fi
