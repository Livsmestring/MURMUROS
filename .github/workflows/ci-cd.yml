name: CI/CD Pipeline for MURMUROS

on:
  schedule:
    - cron: "0 2 * * *" # Runs at 2 AM daily
  push:
    branches:
      - main
  pull_request:

# Least-privilege default for the GITHUB_TOKEN across all jobs.
permissions:
  contents: read

jobs:
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

  build-and-test:
    name: Build and Test (Node)
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up the environment (Install dependencies)
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16

      - name: Install dependencies
        run: npm install

      # Step 3: Run Tests
      - name: Run tests
        run: npm test

  static-analysis:
    name: Static Analysis and Code Quality
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 1: Run ESLint for code quality checks
      - name: Run ESLint for code quality checks
        run: npx eslint .

      # Step 2: Run additional static analysis, if needed
      - name: Static Code Analysis Placeholder
        run: echo "Add tools like SonarCloud, PyLint, or Flake8 based on your project"

  # NOTE: CodeQL security scanning is handled by the repository's CodeQL
  # "default setup" (Settings → Code security), which already scans Python and
  # GitHub Actions. A workflow-defined ("advanced") CodeQL job cannot run while
  # default setup is enabled — it fails with a configuration error — so it is
  # intentionally not defined here. To move scanning into this workflow instead,
  # disable default setup in repo settings and add a CodeQL job back.

  deploy:
    name: Deploy to Staging Environment
    runs-on: ubuntu-latest
    needs: [python-tests, build-and-test, static-analysis]
    if: github.ref == 'refs/heads/main' # Deploy only from the main branch

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy Application
        run: npm run deploy:staging