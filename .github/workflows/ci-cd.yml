name: CI Pipeline for MURMUROS

# The repository currently contains documentation, workflow definitions and a
# standalone Python prototype — no Node.js application yet. This pipeline
# validates exactly that content so CI stays green and meaningful.
#
# When the Node.js application lands (package.json), reintroduce the
# build/test, ESLint, CodeQL and deploy jobs on a current LTS Node version.

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint-yaml:
    name: Lint YAML
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: yamllint -d relaxed --strict .github/

  check-python:
    name: Check Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: python -m compileall -q .
