name: CI/CD Pipeline for MURMUROS

on:
  schedule:
    - cron: "0 2 * * *"
  push:
    branches:
      - main
  pull_request:

jobs:
  detect-languages:
    name: Detect Languages
    runs-on: ubuntu-latest
    outputs:
      has_python: ${{ steps.check.outputs.has_python }}
      has_js: ${{ steps.check.outputs.has_js }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for language files
        id: check
        run: |
          echo "has_python=$(find . -name '*.py' | grep -q . && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "has_js=$([ -f package.json ] && echo true || echo false)" >> $GITHUB_OUTPUT

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: detect-languages
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        if: needs.detect-languages.outputs.has_js == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS dependencies
        if: needs.detect-languages.outputs.has_js == 'true'
        run: npm install

      - name: Run JS tests
        if: needs.detect-languages.outputs.has_js == 'true'
        run: npm test

      - name: Set up Python
        if: needs.detect-languages.outputs.has_python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        if: needs.detect-languages.outputs.has_python == 'true' && hashFiles('requirements.txt') != ''
        run: pip install -r requirements.txt

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    needs: [detect-languages, build-and-test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        if: needs.detect-languages.outputs.has_js == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS dependencies
        if: needs.detect-languages.outputs.has_js == 'true'
        run: npm install

      - name: Run ESLint
        if: needs.detect-languages.outputs.has_js == 'true'
        run: npx eslint .

      - name: Set up Python
        if: needs.detect-languages.outputs.has_python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Flake8
        if: needs.detect-languages.outputs.has_python == 'true'
        run: pip install flake8

      - name: Run Flake8
        if: needs.detect-languages.outputs.has_python == 'true'
        run: flake8 . --max-line-length=100 --exclude=node_modules

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript, python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-and-test, static-analysis, security-scan]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Deploy to staging
        run: npm run deploy:staging
