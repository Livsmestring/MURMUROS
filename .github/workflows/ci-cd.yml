name: CI/CD Pipeline for MURMUROS

on:
  schedule:
    - cron: "0 2 * * *" # Runs at 2 AM daily
  push:
    branches:
      - main
  pull_request:

# Least-privilege default for the GITHUB_TOKEN across all jobs.
permissions:
  contents: read

jobs:
  lint-yaml:
    name: Lint YAML
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: yamllint --strict .github/

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Run demo end-to-end tests
        run: python -m pytest -q tests/test_demo.py

      - name: Start local mock-auth server
        shell: bash
        env:
          MOCK_AUTH_TOKEN: local-test-token
        run: |
          set -euo pipefail
          python tools/mock_auth_server.py --host 127.0.0.1 --port 18081 >/tmp/murmur-mock-auth.log 2>&1 &
          echo "MOCK_AUTH_PID=$!" >> "$GITHUB_ENV"

      - name: Healthcheck local mock-auth server
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..50}; do
            if curl --fail --silent --show-error http://127.0.0.1:18081/healthz >/dev/null; then
              echo "Mock-auth server is healthy."
              exit 0
            fi
            if [ "$attempt" -eq 50 ]; then
              echo "Healthcheck attempt $attempt/50 failed."
            fi
            sleep 0.1
          done
          echo "Mock-auth server failed healthcheck. Server log:"
          cat /tmp/murmur-mock-auth.log
          exit 1

      - name: Run mock-auth integration tests
        env:
          AUTH_BASE_URL: http://127.0.0.1:18081
          API_KEY: local-test-token
        run: python -m pytest -q tests/test_mock_auth_server.py

      - name: Stop local mock-auth server
        if: always()
        shell: bash
        run: |
          set +e
          if [ -n "${MOCK_AUTH_PID:-}" ]; then
            kill "$MOCK_AUTH_PID" 2>/dev/null || true
            wait "$MOCK_AUTH_PID" 2>/dev/null || true
          fi

  build-and-test:
    name: Build and Test (Node)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  static-analysis:
    name: Static Analysis and Code Quality
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint for code quality checks
        run: npm run lint

  # NOTE: CodeQL security scanning is handled by the repository's CodeQL
  # "default setup" (Settings → Code security), which already scans Python and
  # GitHub Actions. A workflow-defined ("advanced") CodeQL job cannot run while
  # default setup is enabled — it fails with a configuration error — so it is
  # intentionally not defined here. To move scanning into this workflow instead,
  # disable default setup in repo settings and add a CodeQL job back.

  deploy:
    name: Deploy to Staging Environment
    runs-on: ubuntu-latest
    needs: [lint-yaml, python-tests, build-and-test, static-analysis]
    # Deploy only for pushes to main — not for scheduled (cron) runs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Deploy Application
        run: |
          if [ -f package.json ] && npm run | grep -q 'deploy:staging'; then
            npm run deploy:staging
          else
            echo "No deploy:staging script yet — skipping deploy."
          fi
