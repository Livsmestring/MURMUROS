name: CI/CD Pipeline for MURMUROS

on:
  schedule:
    - cron: "0 2 * * *" # Runs at 2 AM daily
  push:
    branches:
      - main
  pull_request:

jobs:
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

  build-and-test:
    name: Build and Test (Node)
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up the environment (Install dependencies)
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16

      # The Node.js platform code is not scaffolded yet (no package.json).
      # Guard these steps so the pipeline does not fail before that code lands;
      # they activate automatically once a package.json is committed.
      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm install
          else
            echo "No package.json yet — skipping npm install."
          fi

      # Step 3: Run Tests
      - name: Run tests
        run: |
          if [ -f package.json ]; then
            npm test
          else
            echo "No package.json yet — skipping npm test (see python-tests job)."
          fi

  static-analysis:
    name: Static Analysis and Code Quality
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 1: Run a linter (e.g., ESLint for JavaScript/Node.js projects).
      # Skipped until an ESLint config exists so it does not fail the pipeline.
      - name: Run ESLint for code quality checks
        run: |
          if ls .eslintrc* eslint.config.* >/dev/null 2>&1; then
            npx eslint .
          else
            echo "No ESLint config yet — skipping lint."
          fi

      # Step 2: Run additional static analysis, if needed
      - name: Static Code Analysis Placeholder
        run: echo "Add tools like SonarCloud, PyLint, or Flake8 based on your project"

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: build-and-test

    strategy:
      fail-fast: false
      matrix:
        # Scan every language that actually exists in the repo. Today that is
        # Python (generate_midi.py); JavaScript is kept for the planned Node.js
        # platform code.
        language: ['python', 'javascript']

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 1: Run GitHub CodeQL analysis for security scanning
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2

  deploy:
    name: Deploy to Staging Environment
    runs-on: ubuntu-latest
    needs: [python-tests, build-and-test, static-analysis, security-scan]
    if: github.ref == 'refs/heads/main' # Deploy only from the main branch

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy Application
        run: |
          if [ -f package.json ] && npm run | grep -q 'deploy:staging'; then
            npm run deploy:staging
          else
            echo "No deploy:staging script yet — skipping deploy."
          fi