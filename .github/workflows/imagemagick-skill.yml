name: ImageMagick Skill CI

on:
  push:
  pull_request:

# The workflow only reads repository contents and needs no secrets.
permissions:
  contents: read

concurrency:
  group: imagemagick-skill-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Validate ImageMagick skill
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends imagemagick

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Validate skill structure and metadata
        run: python skills/imagemagick-workflow/scripts/validate_skill.py

      - name: Run ImageMagick integration tests
        run: python skills/imagemagick-workflow/scripts/test_convert_images.py

      - name: Run Python syntax checks
        run: python -m py_compile skills/imagemagick-workflow/scripts/convert_images.py skills/imagemagick-workflow/scripts/test_convert_images.py skills/imagemagick-workflow/scripts/validate_skill.py
